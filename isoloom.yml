# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# ADLab (by xbufu): a PowerShell module that builds an Active Directory lab for internal
# penetration testing. One Windows Server 2019 domain controller for bufu-sec.local, filled by
# upstream's Invoke-ADLabFill, with Kerberoasting, ACL abuse (a path to Domain Admins) and PS
# remoting set by its attack-vector functions. Source:
# https://github.com/xbufu/ADLab, vendored in ADLab/. Built by provision/main.yml from a
# controller Isoloom adds. VM targets only. `isoloom run vagrant`, then `isoloom test vagrant`.
version: 1
name: adlab-xbufu

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: { description: "This player's flag, written to C:\\ctf\\flag.txt on dc01." }

networks:
  lab: { cidr: 10.60.86.0/24 }

machines:
  dc01:
    os: windows-server@2019
    networks: { lab: 10 }
    ports:
      dns: 53
      kerberos: 88
      rpc: 135
      ldap: 389
      smb: 445
      winrm: 5985
    resources: { cpus: 2, memory_mb: 3072 }
    # The player's flag is staged for flag.ps1, which writes C:\ctf\flag.txt readable by
    # Administrators and SYSTEM only (Domain Admin on a DC) before the playbook runs.
    files:
      - { path: 'C:\Windows\Temp\ctf_flag_main', input: CTF_FLAG_MAIN }
    app:
      steps:
        - run: provision/flag.ps1

provision:
  - ansible: provision/main.yml
    requirements: provision/requirements.yml
    groups:
      dc: [dc01]

checks:
  - { name: dns answers, tcp: "dc01:53", wait: 300 }
  - { name: kerberos answers, tcp: "dc01:88" }
  - { name: ldap answers, tcp: "dc01:389" }
  - { name: smb answers, tcp: "dc01:445" }
  - checks/adlab-objects.sh

message: |
  ADLab is up: dc01, the domain controller of bufu-sec.local, at {{ machines.dc01.addresses.lab }}.
  Users are random on every build. Spray or roast your way to a first account, then follow the
  ACLs from the Normies to the Domain Admins.
  Domain Admin reads the flag in C:\ctf\flag.txt on dc01.
